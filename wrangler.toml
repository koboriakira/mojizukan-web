name = "mojizukan-web"
main = "src/index.ts"
compatibility_date = "2026-06-27"
compatibility_flags = ["nodejs_als"]

[vars]
SENTRY_DSN = ""

[assets]
directory = "public"

[[d1_databases]]
binding = "DB"
database_name = "mojizukan-db"
database_id = "14e6c603-1287-4301-aa78-40e1b527985c"

[ai]
binding = "AI"

# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, OPENAI_API_KEY は wrangler secret put で設定

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "mojizukan-images"

# --- Staging 環境 ---
# wrangler deploy --env staging でデプロイ
# bindings は環境間で継承されないため全て明示定義

[env.staging.vars]
SENTRY_DSN = ""
DEV_LOGIN = "true"

[env.staging.assets]
directory = "public"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "mojizukan-db-staging"
database_id = "8203e14f-e2f7-4288-b83c-da660ea70b4c"

[env.staging.ai]
binding = "AI"

[[env.staging.r2_buckets]]
binding = "IMAGES"
bucket_name = "mojizukan-images-staging"
