name: Migrate Staging

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: One-off - reconcile 0012->0013 rename in d1_migrations tracking
        run: |
          npx wrangler d1 execute mojizukan-db-staging --env staging --remote --command \
            "UPDATE d1_migrations SET name='0013_rename_is_discovered_to_is_hakken.sql' WHERE name='0012_rename_is_discovered_to_is_hakken.sql'"
      - name: Apply migrations
        run: npx wrangler d1 migrations apply mojizukan-db-staging --env staging --remote
