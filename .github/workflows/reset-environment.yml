name: Reset Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "対象環境"
        required: true
        type: choice
        options:
          - staging
        default: staging
      confirm:
        description: "Type 'reset' to confirm destructive operation"
        required: true
        type: string

jobs:
  reset:
    if: github.event.inputs.confirm == 'reset'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: mojizukan-db-${{ github.event.inputs.environment }}
      BUCKET_NAME: mojizukan-images-${{ github.event.inputs.environment }}
      ENV_FLAG: --env ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      - name: Clear R2 bucket
        run: |
          echo "=== R2 クリア ($BUCKET_NAME) ==="
          python3 -c "
          import json, urllib.request, urllib.parse

          account_id = '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          token = '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          bucket = '${BUCKET_NAME}'
          all_keys = []
          cursor = None

          while True:
              url = f'https://api.cloudflare.com/client/v4/accounts/{account_id}/r2/buckets/{bucket}/objects'
              if cursor:
                  url += f'?cursor={cursor}'
              req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}'})
              with urllib.request.urlopen(req) as resp:
                  data = json.load(resp)
              objects = data.get('result', [])
              for obj in objects:
                  all_keys.append(obj['key'])
              cursor = data.get('result_info', {}).get('cursor')
              if not cursor or not objects:
                  break

          print(f'Found {len(all_keys)} objects')
          deleted = 0
          for key in all_keys:
              url = f'https://api.cloudflare.com/client/v4/accounts/{account_id}/r2/buckets/{bucket}/objects/{urllib.parse.quote(key, safe=\"\")}'
              req = urllib.request.Request(url, method='DELETE', headers={'Authorization': f'Bearer {token}'})
              try:
                  with urllib.request.urlopen(req) as resp:
                      pass
                  deleted += 1
              except Exception as e:
                  print(f'  ERROR: {key}: {e}')
          print(f'Deleted {deleted}/{len(all_keys)} objects')
          "

      - name: Reset D1 database
        run: |
          echo "=== D1 リセット ($DB_NAME) ==="
          TABLES=$(npx wrangler d1 execute "$DB_NAME" --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE '_cf_%' AND name != 'd1_migrations' AND name != 'sqlite_sequence';" \
            --json 2>/dev/null | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          tables = [r['name'] for r in data[0].get('results', [])]
          print('\n'.join(tables))
          ")

          if [ -z "$TABLES" ]; then
            echo "No tables to drop"
          else
            echo "Dropping tables: $TABLES"
            for attempt in 1 2 3; do
              REMAINING=""
              for table in $TABLES; do
                npx wrangler d1 execute "$DB_NAME" --remote \
                  --command "DROP TABLE IF EXISTS \"$table\";" 2>/dev/null \
                  && echo "  ✓ $table" \
                  || REMAINING="${REMAINING} ${table}"
              done
              TABLES="$REMAINING"
              if [ -z "$TABLES" ]; then break; fi
              echo "  Retry (attempt $((attempt+1))): $TABLES"
            done
          fi

          echo "Clearing migration history..."
          npx wrangler d1 execute "$DB_NAME" --remote \
            --command "DELETE FROM d1_migrations;"

          echo "Applying migrations..."
          npx wrangler d1 migrations apply "$DB_NAME" $ENV_FLAG --remote

      - name: Seed shared cache
        run: |
          echo "=== シード投入 ($DB_NAME / $BUCKET_NAME) ==="
          COUNT=0
          TOTAL=$(ls cache-samples/images/*.webp 2>/dev/null | wc -l | tr -d ' ')
          for img in cache-samples/images/*.webp; do
            COUNT=$((COUNT + 1))
            FILENAME=$(basename "$img")
            echo "[$COUNT/$TOTAL] $FILENAME"
            npx wrangler r2 object put "$BUCKET_NAME/cache/$FILENAME" \
              --file "$img" --content-type "image/webp" --remote 2>/dev/null || true
          done

          STYLES="ehon honwaka pop watercolor zukan"
          SQL=""
          for desc_file in cache-samples/descriptions/*.json; do
            WORD=$(basename "$desc_file" .json)
            DESC=$(python3 -c "import json; d=json.load(open('$desc_file')); print(d['description'].replace(\"'\",\"''\"))")
            for STYLE in $STYLES; do
              if [ -f "cache-samples/images/${STYLE}_${WORD}.webp" ]; then
                SQL="${SQL}INSERT OR IGNORE INTO shared_cache (word, style, image_url, description) VALUES ('${WORD}', '${STYLE}', '/images/cache/${STYLE}_${WORD}.webp', '${DESC}');"
              fi
            done
          done
          npx wrangler d1 execute "$DB_NAME" --command "$SQL" --remote

          echo "=== 完了 ==="
          echo "画像: $TOTAL 件"
