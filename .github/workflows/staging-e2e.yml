name: Staging E2E

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: "ステージング URL"
        default: "https://mojizukan-web.private-beats.workers.dev"

jobs:
  staging-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:staging
        env:
          STAGING_URL: ${{ github.event.inputs.staging_url }}
