name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  preview:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      - name: Compute preview name
        id: slug
        run: |
          BRANCH_SLUG=$(echo "${{ github.head_ref }}" | sed 's/[^a-zA-Z0-9]/-/g' | cut -c1-28)
          PREVIEW_NAME="mojizukan-pre-${BRANCH_SLUG}"
          echo "name=${PREVIEW_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create preview D1
        id: d1
        run: |
          DB_NAME="${{ steps.slug.outputs.name }}-db"
          OUTPUT=$(npx wrangler d1 create "${DB_NAME}" --location apac 2>&1 || true)
          if echo "$OUTPUT" | grep -q "already exists"; then
            DB_ID=$(npx wrangler d1 list --json 2>/dev/null | python3 -c "import sys,json; dbs=json.load(sys.stdin); print(next(d['uuid'] for d in dbs if d['name']=='${DB_NAME}'))")
          else
            DB_ID=$(echo "$OUTPUT" | grep -oP 'database_id\s*=\s*"\K[^"]+')
          fi
          echo "id=${DB_ID}" >> "$GITHUB_OUTPUT"
          echo "db_name=${DB_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create preview R2 bucket
        id: r2
        run: |
          BUCKET_NAME="${{ steps.slug.outputs.name }}-images"
          npx wrangler r2 bucket create "${BUCKET_NAME}" 2>/dev/null || true
          echo "bucket=${BUCKET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate preview config
        run: |
          cat > wrangler-preview.toml <<TOML
          name = "${{ steps.slug.outputs.name }}"
          main = "src/index.ts"
          compatibility_date = "2026-06-27"
          compatibility_flags = ["nodejs_als"]

          [vars]
          SENTRY_DSN = ""
          DEV_LOGIN = "true"

          [assets]
          directory = "public"

          [[d1_databases]]
          binding = "DB"
          database_name = "${{ steps.d1.outputs.db_name }}"
          database_id = "${{ steps.d1.outputs.id }}"

          [ai]
          binding = "AI"

          [[r2_buckets]]
          binding = "IMAGES"
          bucket_name = "${{ steps.r2.outputs.bucket }}"
          TOML

      - name: Apply D1 migrations (preview)
        run: npx wrangler d1 migrations apply "${{ steps.d1.outputs.db_name }}" --remote --config wrangler-preview.toml

      - name: Deploy preview
        id: preview
        run: |
          npx wrangler deploy --config wrangler-preview.toml 2>&1 | tee /tmp/deploy.log
          URL=$(grep -oP 'https://[^ ]+\.workers\.dev' /tmp/deploy.log | head -1)
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Configure secrets
        run: |
          NAME="${{ steps.slug.outputs.name }}"
          echo "${{ secrets.OPENAI_API_KEY }}" | npx wrangler secret put OPENAI_API_KEY --name "${NAME}"

      - name: Seed shared cache (preview)
        run: |
          BUCKET="${{ steps.r2.outputs.bucket }}"
          DB_NAME="${{ steps.d1.outputs.db_name }}"
          # R2 に画像をアップロード（preview バケット）
          for img in cache-samples/images/*.webp; do
            FILENAME=$(basename "$img")
            npx wrangler r2 object put "${BUCKET}/cache/$FILENAME" --file "$img" --content-type "image/webp" --remote 2>/dev/null || true
          done
          # D1 に shared_cache レコードを投入（preview DB）
          STYLES="ehon honwaka pop watercolor zukan"
          SQL=""
          for desc_file in cache-samples/descriptions/*.json; do
            WORD=$(basename "$desc_file" .json)
            DESC=$(python3 -c "import json; d=json.load(open('$desc_file')); print(d['description'].replace(\"'\",\"''\"))")
            for STYLE in $STYLES; do
              if [ -f "cache-samples/images/${STYLE}_${WORD}.webp" ]; then
                SQL="${SQL}INSERT OR IGNORE INTO shared_cache (word, style, image_url, description) VALUES ('${WORD}', '${STYLE}', '/images/cache/${STYLE}_${WORD}.webp', '${DESC}');"
              fi
            done
          done
          npx wrangler d1 execute "${DB_NAME}" --command "$SQL" --remote

      - name: Comment preview URL
        uses: actions/github-script@v8
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            const name = '${{ steps.slug.outputs.name }}';
            const body = `🔗 **Preview**: ${url}\n\n🔑 **テスト用ログイン**: [認証済み状態](${url}/api/dev/auto-login) ・ [ログアウト](${url}/api/dev/auto-logout) ・ [チケット10枚](${url}/api/dev/auto-login?tickets=10)\n\n📋 **ログ監視**: \`npx wrangler tail ${name}\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes('🔗 **Preview**'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body
              });
            }

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx wrangler d1 migrations apply mojizukan-db --remote
      - name: Seed shared cache (production)
        run: |
          # R2 に画像をアップロード
          for img in cache-samples/images/*.webp; do
            FILENAME=$(basename "$img")
            npx wrangler r2 object put "mojizukan-images/cache/$FILENAME" --file "$img" --content-type "image/webp" --remote 2>/dev/null || true
          done
          # D1 に shared_cache レコードを投入
          STYLES="ehon honwaka pop watercolor zukan"
          SQL=""
          for desc_file in cache-samples/descriptions/*.json; do
            WORD=$(basename "$desc_file" .json)
            DESC=$(python3 -c "import json; d=json.load(open('$desc_file')); print(d['description'].replace(\"'\",\"''\"))")
            for STYLE in $STYLES; do
              if [ -f "cache-samples/images/${STYLE}_${WORD}.webp" ]; then
                SQL="${SQL}INSERT OR IGNORE INTO shared_cache (word, style, image_url, description) VALUES ('${WORD}', '${STYLE}', '/images/cache/${STYLE}_${WORD}.webp', '${DESC}');"
              fi
            done
          done
          npx wrangler d1 execute mojizukan-db --command "$SQL" --remote
      - run: npx wrangler deploy
